  </main>

  <!-- 底部 Footer -->
  <footer class="border-t border-slate-800 bg-slate-950 py-5 text-center text-xs text-slate-500">
    <div class="max-w-6xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-2">
      <div>Danny 排球團 - 芳和實中每週二排球分組系統</div>
      <div class="flex items-center gap-3">
        <span>資料來源：Google Sheets 即時同步</span>
        <span>•</span>
        <span>男女比例均等隨機分組</span>
      </div>
    </div>
  </footer>

  <!-- Toast 提示 -->
  <div id="toast" class="fixed bottom-6 right-6 bg-slate-800 border border-slate-600 text-white px-4 py-3 rounded-xl shadow-2xl transition-opacity duration-300 opacity-0 pointer-events-none flex items-center gap-2 z-50 text-sm">
    <i class="fa-solid fa-circle-check text-emerald-400"></i>
    <span id="toastMsg">已複製到剪貼簿！</span>
  </div>

  <script>
    // 常數與資料結構
    const SHEET_ID = '1YJeeKy7ZwQiUU4n5UByINY3sK2ZPsaA2dL2nnv6c8FU';
    const SHEET_URL = `https://docs.google.com/spreadsheets/d/1YJeeKy7ZwQiUU4n5UByINY3sK2ZPsaA2dL2nnv6c8FU/gviz/tq?tqx=out:json`;

    let allDates = []; // [{ colIndex: 7, label: "11/03", year: 2026, month: 11, day: 3, diff: 0 }]
    let selectedDateCol = null;
    let rawSheetRows = [];
    let currentPlayers = []; // 當前選中日期的所有有效球員 [{ name, originalName, gender, isGuessed, type: '季打'|'臨打', enabled: true }]
    let currentGroups = [[], [], [], [], []];

    // 性別推斷資料庫 (針對中文常見男女名、英文名、及本排球團臨打名冊進行最佳化)
    const FEMALE_NAMES = new Set([
      'evelyn', 'monica', 'wendy', 'winnie', 'luna', 'penny', 'alice', 'amy', 'angela', 'anna',
      'bella', 'cindy', 'debby', 'doris', 'emily', 'emma', 'eva', 'grace', 'helen', 'iris',
      'ivy', 'jenny', 'jessica', 'joyce', 'judy', 'julia', 'kelly', 'lily', 'linda', 'lisa',
      'lucy', 'mandy', 'mary', 'may', 'mia', 'peggy', 'rita', 'ruby', 'sandy', 'sarah',
      'sophia', 'tiffany', 'vicky', 'vivian', 'zoe', '10', '禧', '昕', '安', '柔安', '小藍'
    ]);

    const FEMALE_CHARS = new Set([
      '昕', '安', '萱', '婷', '妤', '雅', '彤', '涵', '潔', '芸', '晴', '瑜', '欣', '蓉', '儀', '文',
      '琪', '靜', '茹', '柔', '嵐', '茜', '蓁', '琳', '珊', '芳', '娟', '惠', '美', '敏', '佳', '瑄',
      '萍', '真', '翎', '瑤', '伶', '芝', '蓓', '薇', '穎', '婕', '馨', '佩', '依', '玲', '純', '秀',
      '芬', '燕', '姬', '妍', '娜', '妮', '妹', '娘', '娥', '媛', '嫻', '嬋', '禧'
    ]);

    const MALE_NAMES = new Set([
      'jack', 'danny', 'ho', 'scott', 'alex', 'andy', 'ben', 'brian', 'chris', 'david', 'eric',
      'frank', 'gary', 'hank', 'jason', 'jeff', 'jerry', 'jimmy', 'john', 'ken', 'kevin', 'leo',
      'mark', 'mike', 'nick', 'paul', 'peter', 'ray', 'sam', 'tim', 'tony', 'victor', 'william',
      '竣元', '乘加', '塔可', '阿迪', '金聖', '董剛', '史尬', '愛貓', '阿璽', '證諺'
    ]);

    const MALE_CHARS = new Set([
      '元', '竣', '加', '乘', '剛', '迪', '聖', '狼', '璽', '諺', '尬', '豪', '宇', '翔', '傑', '廷',
      '銘', '睿', '宸', '祐', '柏', '威', '峰', '倫', '恩', '宏', '維', '瑋', '凱', '勝', '民', '強',
      '誠', '輝', '龍', '德', '武', '俊', '志', '健', '博', '斌', '冠', '霖', '碩', '毅', '瀚', '昌',
      '洋', '澤', '濤', '超', '達', '可'
    ]);

    // 判斷球員性別的核心算法
    function detectGender(rawName) {
      if (!rawName) return { gender: '男', isGuessed: true };
      const str = rawName.trim();

      // 1. 括號或直接字樣明確寫男女
      if (/[（(]\s*男\s*[）)]|\[男\]|（男）|\(男\)|_男|男/.test(str)) {
        return { gender: '男', isGuessed: false };
      }
      if (/[（(]\s*女\s*[）)]|\[女\]|（女）|\(女\)|_女|女/.test(str)) {
        return { gender: '女', isGuessed: false };
      }

      // 2. 去除前綴干擾，例如 "柔安友_", "狼友_", "Scott友_"
      let cleanName = str.replace(/^[A-Za-z0-9_\u4e00-\u9fa5]+[友咖]_?/, '')
                         .replace(/[（(].*?[）)]/g, '')
                         .trim();
      const lowerClean = cleanName.toLowerCase();

      // 3. 英文名字或精確字匹配
      if (FEMALE_NAMES.has(lowerClean)) {
        return { gender: '女', isGuessed: true };
      }
      if (MALE_NAMES.has(lowerClean)) {
        return { gender: '男', isGuessed: true };
      }

      // 4. 中文單字啟發式特徵比對
      let femaleScore = 0;
      let maleScore = 0;
      for (const ch of cleanName) {
        if (FEMALE_CHARS.has(ch)) femaleScore += 2;
        if (MALE_CHARS.has(ch)) maleScore += 2;
      }

      if (femaleScore > maleScore) {
        return { gender: '女', isGuessed: true };
      } else if (maleScore > femaleScore) {
        return { gender: '男', isGuessed: true };
      }

      // 5. 若無特徵，預設為男（可由使用者在 UI 上一鍵切換）
      return { gender: '男', isGuessed: true };
    }

    // 透過動態 JSONP 讀取 Google Sheets (徹底免除瀏覽器 CORS 限制)
    function fetchSheetData() {
      const icon = document.getElementById('refreshIcon');
      icon.classList.add('fa-spin');
      updateStatus('正在連線至 Google Sheets 讀取最新名冊...', 'loading');

      // 建立動態 callback
      const callbackName = 'gvizCallback_' + Date.now();
      window[callbackName] = function(json) {
        cleanup();
        parseSheetResponse(json);
      };

      const script = document.createElement('script');
      script.id = 'gvizScriptTag';
      script.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=responseHandler:${callbackName}`;
      script.onerror = function() {
        cleanup();
        console.warn('JSONP 載入異常，啟動備份解析機制...');
        loadFallbackData();
      };

      function cleanup() {
        icon.classList.remove('fa-spin');
        delete window[callbackName];
        const s = document.getElementById('gvizScriptTag');
        if (s && s.parentNode) s.parentNode.removeChild(s);
      }

      document.body.appendChild(script);
    }

    // 解析 Google Sheet 回傳的表格 JSON
    function parseSheetResponse(json) {
      try {
        if (!json || !json.table || !json.table.rows) {
          throw new Error('回傳資料格式不符');
        }

        rawSheetRows = json.table.rows;
        findDateColumns();
        populateDateDropdown();
        loadSelectedDatePlayers();
        
        // 自動執行一次分組
        runGrouping();

        updateStatus('資料同步成功！已取得最新排球名冊', 'success');
        document.getElementById('syncTime').textContent = new Date().toLocaleTimeString('zh-TW');
      } catch (err) {
        console.error('解析 Sheet 失敗:', err);
        updateStatus('解析失敗，已切換至備份名冊', 'error');
        loadFallbackData();
      }
    }

    // 尋找日期欄位並計算與今日最接近的日期
    function findDateColumns() {
      allDates = [];
      const headerRow = rawSheetRows[0].c;
      const today = new Date();
      const currentYear = today.getFullYear();

      for (let c = 3; c < headerRow.length; c++) {
        const cell = headerRow[c];
        if (!cell) continue;
        const text = (cell.f || cell.v || '').toString().trim();
        if (text.includes('/')) {
          const parts = text.split('/');
          const month = parseInt(parts[0], 10);
          const day = parseInt(parts[1], 10);
          
          // 計算絕對差距毫秒
          const targetDate = new Date(currentYear, month - 1, day);
          const diff = Math.abs(targetDate.getTime() - today.getTime());

          allDates.push({
            colIndex: c,
            label: text,
            year: currentYear,
            month: month,
            day: day,
            diff: diff
          });
        }
      }

      // 依差距排序，找出最接近的
      let nearestIndex = 0;
      let minDiff = Infinity;
      allDates.forEach((d, idx) => {
        if (d.diff < minDiff) {
          minDiff = d.diff;
          nearestIndex = idx;
        }
      });

      // 標註最接近
      allDates.forEach((d, idx) => {
        d.isNearest = (idx === nearestIndex);
      });

      // 預設選中最近的一天
      selectedDateCol = allDates[nearestIndex].colIndex;
    }

    // 填入日期下拉選單
    function populateDateDropdown() {
      const select = document.getElementById('dateSelect');
      select.innerHTML = '';

      allDates.forEach(d => {
        const opt = document.createElement('option');
        opt.value = d.colIndex;
        opt.textContent = `${d.label} (週二) ${d.isNearest ? ' ★ 最接近' : ''}`;
        if (d.colIndex === selectedDateCol) {
          opt.selected = true;
        }
        select.appendChild(opt);
      });

      checkNearestBadge();
    }

    function checkNearestBadge() {
      const current = allDates.find(d => d.colIndex === selectedDateCol);
      const badge = document.getElementById('nearestBadge');
      if (current && current.isNearest) {
        badge.classList.remove('hidden');
      } else {
        badge.classList.add('hidden');
      }
    }

    function onDateChange() {
      const select = document.getElementById('dateSelect');
      selectedDateCol = parseInt(select.value, 10);
      checkNearestBadge();
      loadSelectedDatePlayers();
      runGrouping();
    }

    // 載入選定日期的出席球員名單
    function loadSelectedDatePlayers() {
      currentPlayers = [];
      const col = selectedDateCol;

      // 1. 季打名冊 (Row 1 ~ 15)
      for (let r = 1; r <= 15; r++) {
        if (r >= rawSheetRows.length) break;
        const row = rawSheetRows[r].c;
        if (!row || !row[2]) continue;
        const nameVal = (row[2].f || row[2].v || '').toString().trim();
        if (!nameVal) continue;

        // 檢查該日期是否有請假
        const dateCell = (col < row.length && row[col]) ? (row[col].f || row[col].v || '').toString().trim() : '';
        const isAbsent = dateCell.includes('請假');

        if (!isAbsent) {
          const detected = detectGender(nameVal);
          currentPlayers.push({
            id: 'season_' + r,
            name: nameVal,
            cleanName: nameVal.replace(/[（(].*?[）)]/g, '').trim(),
            gender: detected.gender,
            isGuessed: detected.isGuessed,
            type: '季打',
            enabled: true
          });
        }
      }

      // 2. 臨打名冊 (從 Row 18 開始，通常偶數行是名字)
      for (let r = 18; r < rawSheetRows.length; r += 2) {
        const row = rawSheetRows[r].c;
        if (!row) continue;
        const dateCell = (col < row.length && row[col]) ? (row[col].f || row[col].v || '').toString().trim() : '';
        
        // 若有填寫名字且非請假註記
        if (dateCell && !dateCell.includes('請假') && dateCell !== '-') {
          const detected = detectGender(dateCell);
          currentPlayers.push({
            id: 'guest_' + r,
            name: dateCell,
            cleanName: dateCell.replace(/^[A-Za-z0-9_\u4e00-\u9fa5]+[友咖]_?/, '').replace(/[（(].*?[）)]/g, '').trim(),
            gender: detected.gender,
            isGuessed: detected.isGuessed,
            type: '臨打',
            enabled: true
          });
        }
      }

      renderRoster();
      updateStats();
    }

    // 渲染出席名單標籤與性別切換
    function renderRoster() {
      const seasonContainer = document.getElementById('seasonContainer');
      const guestContainer = document.getElementById('guestContainer');
      seasonContainer.innerHTML = '';
      guestContainer.innerHTML = '';

      let seasonCount = 0;
      let guestCount = 0;

      currentPlayers.forEach(p => {

        // 出席勾選
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = p.enabled;
        checkbox.className = 'rounded bg-slate-800 border-slate-700 text-orange-500 focus:ring-0 cursor-pointer';
        checkbox.onchange = (e) => {
          p.enabled = e.target.checked;
          renderRoster();
          updateStats();
        };

        // 姓名
        const nameSpan = document.createElement('span');
        nameSpan.className = 'font-medium';
        nameSpan.textContent = p.name;

        // 可點擊切換男女的徽章
        const genderBtn = document.createElement('button');
        genderBtn.type = 'button';
        genderBtn.className = `px-1.5 py-0.5 rounded text-[10px] font-bold transition flex items-center gap-0.5 ${
          p.gender === '男' 
            ? 'bg-blue-500/20 text-blue-300 hover:bg-blue-500/30 border border-blue-500/30' 
            : 'bg-pink-500/20 text-pink-300 hover:bg-pink-500/30 border border-pink-500/30'
        }`;
        genderBtn.innerHTML = p.gender === '男' ? '<i class="fa-solid fa-mars"></i> 男' : '<i class="fa-solid fa-venus"></i> 女';
        genderBtn.title = '點擊切換男女' + (p.isGuessed ? ' (智慧推斷)' : '');
        genderBtn.onclick = (e) => {
          e.stopPropagation();
          p.gender = p.gender === '男' ? '女' : '男';
          p.isGuessed = false;
          renderRoster();
          updateStats();
        };

        tag.appendChild(checkbox);
        tag.appendChild(nameSpan);
        tag.appendChild(genderBtn);

        if (p.isGuessed) {
          const guessBadge = document.createElement('span');

          guessBadge.textContent = '推斷';

          tag.appendChild(guessBadge);
        }

          seasonContainer.appendChild(tag);
          if (p.enabled) seasonCount++;
        } else {
          guestContainer.appendChild(tag);
          if (p.enabled) guestCount++;
        }

      document.getElementById('seasonCount').textContent = seasonCount;
      document.getElementById('guestCount').textContent = guestCount;
      document.getElementById('rosterCount').textContent = seasonCount + guestCount;
    }

    // 更新統計資訊
    function updateStats() {
      const active = currentPlayers.filter(p => p.enabled);
      const males = active.filter(p => p.gender === '男');
      const females = active.filter(p => p.gender === '女');

      document.getElementById('statTotal').textContent = active.length;
      document.getElementById('statMale').textContent = males.length;
      document.getElementById('statFemale').textContent = females.length;
    }

    // Fisher-Yates 隨機洗牌
    function shuffleArray(arr) {
      const result = [...arr];
      for (let i = result.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [result[i], result[j]] = [result[j], result[i]];
      }
      return result;
    }

    // 核心演算法：依據相同男女比例隨機分成五組
    function runGrouping() {
      const active = currentPlayers.filter(p => p.enabled);
      if (active.length === 0) {
        alert('目前無出席人員，請先選擇有效場次或勾選出席人員！');
        return;
      }

      const males = shuffleArray(active.filter(p => p.gender === '男'));
      const females = shuffleArray(active.filter(p => p.gender === '女'));

      // 初始化五組
      const groups = [[], [], [], [], []];

      // 1. 男生均勻隨機分配到 5 組
      males.forEach((m, idx) => {
        groups[idx % 5].push(m);
      });

      // 2. 女生均勻分配：優先分配給目前總人數最少、且女生人數最少的組別
      females.forEach(f => {
        // 尋找最適合補入的組別
        let bestGroup = groups[0];
        for (let i = 1; i < groups.length; i++) {
          const g = groups[i];
          const bestFemaleCount = bestGroup.filter(x => x.gender === '女').length;
          const currentFemaleCount = g.filter(x => x.gender === '女').length;

          if (g.length < bestGroup.length) {
            bestGroup = g;
          } else if (g.length === bestGroup.length && currentFemaleCount < bestFemaleCount) {
            bestGroup = g;
          }
        }
        bestGroup.push(f);
      });

      // 3. 各組內部隨機排序，並重新編序組別以保證整體純隨機
      currentGroups = groups.map(g => shuffleArray(g));

      renderGroupCards();
      showToast('🎉 五組男女均衡分組完成！');
    }

    // 渲染五組卡片
    function renderGroupCards() {
      const container = document.getElementById('groupCardsContainer');
      container.innerHTML = '';

      const teamColors = [
        { name: '第 1 組', border: 'border-red-500/40', badge: 'team-badge-1', icon: 'fa-fire' },
        { name: '第 2 組', border: 'border-blue-500/40', badge: 'team-badge-2', icon: 'fa-bolt' },
        { name: '第 3 組', border: 'border-emerald-500/40', badge: 'team-badge-3', icon: 'fa-leaf' },
        { name: '第 4 組', border: 'border-amber-500/40', badge: 'team-badge-4', icon: 'fa-crown' },
        { name: '第 5 組', border: 'border-purple-500/40', badge: 'team-badge-5', icon: 'fa-star' }
      ];

      currentGroups.forEach((group, idx) => {
        const theme = teamColors[idx];
        const maleCount = group.filter(p => p.gender === '男').length;
        const femaleCount = group.filter(p => p.gender === '女').length;

        const card = document.createElement('div');
        card.className = `bg-slate-800/90 border ${theme.border} rounded-2xl p-4 shadow-xl flex flex-col justify-between transition duration-200 hover:border-slate-500`;

        // 卡片頂部
        const header = document.createElement('div');
        header.className = 'border-b border-slate-700/60 pb-3 mb-3 flex items-center justify-between';
        header.innerHTML = `
          <div class="flex items-center gap-2">
            <span class="w-7 h-7 rounded-lg ${theme.badge} flex items-center justify-center text-xs font-bold shadow">
              ${idx + 1}
            </span>
            <span class="font-bold text-white text-base">${theme.name}</span>
          </div>
          <div class="text-[11px] font-mono px-2 py-0.5 rounded-full bg-slate-900 border border-slate-700 text-slate-300">
            ${group.length} 人 (${maleCount}男 ${femaleCount}女)
          </div>
        `;
        card.appendChild(header);

        // 成員名單列表
        const list = document.createElement('div');
        list.className = 'space-y-2 flex-1';

        group.forEach(player => {
          const item = document.createElement('div');
          item.className = 'flex items-center justify-between bg-slate-900/80 px-3 py-2 rounded-xl border border-slate-700/50';

          const left = document.createElement('div');
          left.className = 'flex items-center gap-2';

          const genderIcon = document.createElement('span');
          genderIcon.className = `text-xs ${player.gender === '男' ? 'text-blue-400' : 'text-pink-400'}`;
          genderIcon.innerHTML = player.gender === '男' ? '<i class="fa-solid fa-mars"></i>' : '<i class="fa-solid fa-venus"></i>';

          const nameSpan = document.createElement('span');
          nameSpan.className = 'text-sm font-semibold text-slate-100';
          nameSpan.textContent = player.name;

          left.appendChild(genderIcon);
          left.appendChild(nameSpan);

          const typeBadge = document.createElement('span');
          typeBadge.className = `text-[10px] px-1.5 py-0.5 rounded font-medium ${
            player.type === '季打' 
              ? 'bg-blue-500/10 text-blue-400 border border-blue-500/20' 
              : 'bg-amber-500/10 text-amber-400 border border-amber-500/20'
          }`;
          typeBadge.textContent = player.type;

          item.appendChild(left);
          item.appendChild(typeBadge);
          list.appendChild(item);
        });

        card.appendChild(list);
        container.appendChild(card);
      });
    }

    // 複製分組結果文字 (適合貼至 LINE / Telegram / 群組)
    function copyResults() {
      const selected = allDates.find(d => d.colIndex === selectedDateCol);
      const dateLabel = selected ? selected.label : '';
      
      let text = `🏐 Danny 排球團 - ${dateLabel} 隨機分組名冊 🏐\n`;
      text += `芳和實中 17:45-20:45 (男女比例均衡五組)\n`;
      text += `=========================\n\n`;

      currentGroups.forEach((group, idx) => {
        const maleCount = group.filter(p => p.gender === '男').length;
        const femaleCount = group.filter(p => p.gender === '女').length;
        text += `【第 ${idx + 1} 組】(${maleCount}男 ${femaleCount}女，共 ${group.length} 人)\n`;
        group.forEach(p => {
          text += `  • ${p.name} (${p.gender}) [${p.type}]\n`;
        });
        text += `\n`;
      });

      text += `=========================\n分組完成，祝大家打球愉快！🔥`;

      navigator.clipboard.writeText(text).then(() => {
        showToast('📋 已複製 LINE 群組格式名冊！');
      }).catch(() => {
        // Fallback for older browsers
        const textarea = document.createElement('textarea');
        textarea.value = text;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        showToast('📋 已複製 LINE 群組格式名冊！');
      });
    }

    // 手動新增臨時球員

      } else if (type === 'success') {

      } else if (type === 'error') {

      }
    }

      const toast = document.getElementById('toast');

      toastMsg.textContent = msg;
      toast.classList.remove('opacity-0', 'pointer-events-none');
      setTimeout(() => {
        toast.classList.add('opacity-0', 'pointer-events-none');
      }, 2500);
    }
